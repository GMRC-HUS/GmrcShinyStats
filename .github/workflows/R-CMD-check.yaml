# R package continuous integration
# Runs R CMD check and the test suite on every push and pull request.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: local
          cache: false

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: >
            --no-manual
            --no-build-vignettes
        check-as-cran: false
